<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT Admin Portal | Shree Taste N Taste Catering</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" href="../assets/images/tnt-logo.jpg" type="image/jpeg">
  <style>
    .admin-login-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .admin-card {
      background: #FFFFFF;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 450px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .admin-badge {
      display: inline-block;
      background: var(--color-maroon-800);
      color: var(--color-gold-300);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body style="background-color: var(--color-bg-surface-alt);">

  <header class="site-header">
    <div class="nav-container">
      <a href="../index.html" class="brand-wrapper">
        <img src="../assets/images/tnt-logo.jpg" alt="TNT Logo" class="brand-logo-img">
        <div class="brand-text-block">
          <span class="brand-name">TNT Catering</span>
          <span class="brand-tagline">Administration Portal</span>
        </div>
      </a>
      <a href="../index.html" style="color: var(--color-gold-300); font-size: 0.85rem; font-weight: 600;">
        ← Back to Customer Storefront
      </a>
    </div>
  </header>

  <main class="admin-login-wrapper">
    <div class="admin-card">
      <span class="admin-badge">Authorized Staff &amp; Kitchen Only</span>
      <h1 style="font-family: var(--font-heading); color: var(--color-maroon-900); font-size: 1.5rem; margin-bottom: 0.5rem;">
        Administrator Login
      </h1>
      <p style="font-size: 0.875rem; color: var(--color-text-muted); margin-bottom: 1.75rem;">
        Access order queue, kitchen preparation stages, and pickup verification.
      </p>

      <div id="login-error-alert" class="alert-box alert-warning hidden" style="margin-bottom: 1.25rem;">
        <span class="alert-icon">⚠️</span>
        <span id="login-error-text"></span>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email" class="form-label">Admin Email</label>
          <input 
            type="email" 
            id="admin-email" 
            class="form-input" 
            placeholder="admin@tntcatering.in" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="admin-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="admin-password" 
            class="form-input" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-admin-login" style="margin-top: 1.5rem;">
          Sign In to Admin Dashboard
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { APP_CONFIG } from '../assets/js/config.js';

    const form = document.getElementById('admin-login-form');
    const errAlert = document.getElementById('login-error-alert');
    const errText = document.getElementById('login-error-text');
    const submitBtn = document.getElementById('btn-admin-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Authentication failed');
        }

        // Store session token securely for API calls
        const adminEmail = (data.admin && data.admin.email) || (data.user && data.user.email) || email;
        const adminRole = (data.admin && data.admin.role) || (data.user && data.user.role) || 'admin';

        sessionStorage.setItem('tnt_admin_token', data.token);
        sessionStorage.setItem('tnt_admin_email', adminEmail);
        sessionStorage.setItem('tnt_admin_role', adminRole);

        window.location.href = 'dashboard.html';

      } catch (err) {
        errText.textContent = err.message || 'Login failed. Please verify your credentials.';
        errAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Admin Dashboard';
      }
    });
  </script>
</body>
</html>
