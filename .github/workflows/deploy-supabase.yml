name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy All Edge Functions to Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set in GitHub repository settings. Skipping Edge Functions deployment."
            echo "Edge Functions automated deployment was skipped because SUPABASE_ACCESS_TOKEN is missing."
            echo "To enable automated Supabase Edge Function deployment, add SUPABASE_ACCESS_TOKEN under GitHub Repo -> Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          supabase functions deploy config --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy create-order --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy verify-payment --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy get-order-status --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy razorpay-webhook --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy admin-login --project-ref bondkwckhnbjslshyflp --no-verify-jwt
          supabase functions deploy admin-metrics --project-ref bondkwckhnbjslshyflp
          supabase functions deploy admin-list-orders --project-ref bondkwckhnbjslshyflp
          supabase functions deploy admin-update-order-status --project-ref bondkwckhnbjslshyflp
          supabase functions deploy admin-verify-pickup --project-ref bondkwckhnbjslshyflp
          supabase functions deploy admin-products --project-ref bondkwckhnbjslshyflp
          supabase functions deploy admin-audit-logs --project-ref bondkwckhnbjslshyflp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
